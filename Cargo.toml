[package]
name = "suzapret"
version = "0.1.0"
edition = "2021"
description = "Cross-platform backend for SuZapret"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"
thiserror = "1"

[lib]
name = "suzapret"
path = "src/lib.rs"

[[bin]]
name = "suzapret"
path = "src/main.rs"
