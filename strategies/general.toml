[metadata]
id = "general"
name = "General Flowseal strategy"
version = 1

[intercept]
tcp_ports = ["80", "443", "2053", "2083", "2087", "2096", "8443"]
udp_ports = ["443", "19294-19344", "50000-50100"]

[[profile]]
id = "general-tls"
protocol = "tcp"
ports = ["80", "443"]
hostlists = ["lists/list-general.txt"]
ipset_excludes = ["lists/ipset-exclude.txt"]
arguments = [
  "--dpi-desync=fake",
  "--dpi-desync-repeats=6",
  "--dpi-desync-fooling=ts",
  "--dpi-desync-fake-tls=bin/tls_clienthello_www_google_com.bin"
]

[[profile]]
id = "general-quic"
protocol = "udp"
ports = ["443"]
hostlists = ["lists/list-general.txt"]
ipset_excludes = ["lists/ipset-exclude.txt"]
arguments = [
  "--dpi-desync=fake",
  "--dpi-desync-repeats=6",
  "--dpi-desync-fake-quic=bin/quic_initial_www_google_com.bin"
]
